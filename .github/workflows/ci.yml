name: ci
# Build VM C + chạy toàn bộ kiểm thử thuần T (trun tools/run_all.t) trên Linux và Windows.
# Job bảo mật: gitleaks (secret scan) + trivy (vuln/misconfig scan) chạy trên
# mọi push/PR, không allow_failure.
on:
  push:
  pull_request:

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
      - name: trivy filesystem
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: sh vm/build.sh
      - name: test
        run: ./trun tools/run_all.t

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: build
        shell: cmd
        run: vm\build.bat
      - name: test
        run: .\trun.exe tools\run_all.t
